services:
  - type: web
    name: turing-agent-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TINYFISH_MOCK
        value: "false"

