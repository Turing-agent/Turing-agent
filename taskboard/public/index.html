<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard - Home</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 { font-size: 24px; font-weight: 700; }
    .nav-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .nav-link:hover { text-decoration: underline; }
    .task-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 14px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    ul.task-list {
      list-style: none;
    }
    ul.task-list li {
      padding: 12px 16px;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      font-size: 15px;
    }
    .version-tag {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TaskBoard</h1>
      <a href="/settings" id="nav-settings" class="nav-link">Settings &rarr;</a>
    </header>

    <div class="task-form">
      <input type="text" id="task-input" placeholder="What needs to be done?" />
      <button id="add-task-btn" onclick="addTask()">Add task</button>
    </div>

    <ul id="task-list" class="task-list">
      <!-- Tasks rendered dynamically -->
    </ul>

    <div class="version-tag" id="app-version-badge">Loading version...</div>
  </div>

  <script>
    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks');
        const data = await res.json();
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        data.tasks.forEach(t => {
          const li = document.createElement('li');
          li.textContent = t.title;
          list.appendChild(li);
        });
      } catch (err) {
        console.error('Failed to load tasks', err);
      }
    }

    async function addTask() {
      const input = document.getElementById('task-input');
      const title = input.value.trim();
      if (!title) return;
      try {
        await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        input.value = '';
        loadTasks();
      } catch (err) {
        console.error('Failed to add task', err);
      }
    }

    async function loadVersion() {
      try {
        const res = await fetch('/version');
        const ver = await res.text();
        document.getElementById('app-version-badge').textContent = 'Version: ' + ver;
      } catch (e) {}
    }

    loadTasks();
    loadVersion();
  </script>
</body>
</html>
