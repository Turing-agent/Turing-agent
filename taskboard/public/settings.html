<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard - Settings</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 { font-size: 24px; font-weight: 700; }
    .nav-link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .nav-link:hover { text-decoration: underline; }
    .danger-zone {
      margin-top: 20px;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.05);
    }
    .danger-zone h3 {
      color: var(--danger);
      font-size: 16px;
      margin-bottom: 8px;
    }
    .danger-zone p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 16px;
    }
    .btn-danger {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: var(--danger);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-danger:hover {
      background: var(--danger-hover);
    }
    #status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      display: none;
    }
    #status.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--success);
      color: #4ade80;
    }
    #status.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #f87171;
    }
    .version-tag {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Account Settings</h1>
      <a href="/" id="nav-home" class="nav-link">&larr; Back to Tasks</a>
    </header>

    <div class="danger-zone">
      <h3>Danger Zone</h3>
      <p>Deleting your account is permanent. All tasks and settings will be permanently removed.</p>
      <button id="delete-account-btn" class="btn-danger" onclick="deleteAccount()">Delete Account</button>
    </div>

    <!-- Status message element -->
    <div id="status"></div>

    <div class="version-tag" id="app-version-badge">Loading version...</div>
  </div>

  <script>
    async function deleteAccount() {
      const statusEl = document.getElementById('status');
      statusEl.className = '';
      statusEl.style.display = 'none';

      try {
        const response = await fetch('/api/delete-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        if (response.ok) {
          const data = await response.json();
          statusEl.textContent = data.message || 'Account deleted successfully';
          statusEl.className = 'success';
        } else {
          // Failure handling
          console.error('delete-account failed: ' + response.status);
          statusEl.textContent = 'Something went wrong';
          statusEl.className = 'error';
        }
      } catch (err) {
        console.error('delete-account failed: network error', err);
        statusEl.textContent = 'Something went wrong';
        statusEl.className = 'error';
      }
    }

    async function loadVersion() {
      try {
        const res = await fetch('/version');
        const ver = await res.text();
        document.getElementById('app-version-badge').textContent = 'Version: ' + ver;
      } catch (e) {}
    }

    loadVersion();
  </script>
</body>
</html>
