version: '3.8'

services:
  provisioner:
    build:
      context: .
      dockerfile: provisioner/Dockerfile
    container_name: autorepro-provisioner
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - VPS_PUBLIC_IP=${VPS_PUBLIC_IP:-127.0.0.1}
      - PROVISIONER_TOKEN=${PROVISIONER_TOKEN:-autorepro_secret_token_123}
      - PORT_RANGE_START=8100
      - PORT_RANGE_END=8199
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      - TINYFISH_MOCK=${TINYFISH_MOCK:-true}
      - UPLOADS_DIR=/app/provisioner/public/uploads
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - uploads_data:/app/provisioner/public/uploads
    networks:
      - autorepro-net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: autorepro-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${VPS_PUBLIC_IP:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${VPS_PUBLIC_IP:-localhost}:5678/
      - GENERIC_TIMEZONE=UTC
      - PROVISIONER_URL=http://provisioner:4000
      - PROVISIONER_TOKEN=${PROVISIONER_TOKEN:-autorepro_secret_token_123}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-auto_repro_webhook_secret_xyz}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-taskboard}
      - JIRA_DOMAIN=${JIRA_DOMAIN:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_TRANSITION_SENT_TO_ENG=${JIRA_TRANSITION_SENT_TO_ENG:-21}
      - JIRA_TRANSITION_CANNOT_REPRODUCE=${JIRA_TRANSITION_CANNOT_REPRODUCE:-31}
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      - TINYFISH_MOCK=${TINYFISH_MOCK:-true}
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - autorepro-net
    depends_on:
      - provisioner

volumes:
  n8n_data:
  uploads_data:

networks:
  autorepro-net:
    driver: bridge
